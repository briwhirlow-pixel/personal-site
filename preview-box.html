<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Box Preview</title>
  <style>
    body { background: #F2F1EC; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: system-ui, sans-serif; gap: 60px; }
    .label { text-align: center; font-size: 12px; color: #737373; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.1em; }

    /* Current — B */
    .box-b {
      width: 96px; height: 96px; border-radius: 22px;
      background: #2563EB; display: flex; align-items: center; justify-content: center;
    }
    .box-b span { color: white; font-weight: 900; font-size: 64px; line-height: 1; margin-top: 4px; }

    /* Option — Built */
    .box-built {
      width: 140px; height: 96px; border-radius: 22px;
      background: #2563EB; display: flex; align-items: center; justify-content: center;
      padding: 0 12px;
    }
    .box-built span { color: white; font-weight: 900; font-size: 36px; line-height: 1; letter-spacing: -1px; }
  </style>
</head>
<body>
  <div>
    <div class="box-b"><span>B</span></div>
    <div class="label">Current (B)</div>
  </div>
  <div>
    <div class="box-built"><span>Built</span></div>
    <div class="label">Option (Built)</div>
  </div>
</body>
</html>
