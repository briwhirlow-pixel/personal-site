<style>
/* Layout concept: a training ledger in four tabs. Today leads with the session you can log set by set; every chart shares the Nov 16 to Jul 21 axis. */
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#14202E; --muted:#5A6A7B; --line:#D6DDE5;
  --navy:#1F3A5F; --accent:#A8802F; --accent-soft:#F3EAD6; --chart:#1F3A5F; --chart-soft:#C9D6E6;
  --ok:#2B8A5F; --warn:#B87514; --bad:#B8452F; --ok-soft:#DDF0E6; --bad-soft:#F6E0DA;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --panel:#151D27; --ink:#E6ECF2; --muted:#8D9CAB; --line:#263341;
  --navy:#9DBBE0; --accent:#D6A94E; --accent-soft:#2A2517; --chart:#8FB3E0; --chart-soft:#26384F;
  --ok:#4CC08A; --warn:#E0A03C; --bad:#E57A63; --ok-soft:#16301F; --bad-soft:#3A201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --panel:#151D27; --ink:#E6ECF2; --muted:#8D9CAB; --line:#263341;
  --navy:#9DBBE0; --accent:#D6A94E; --accent-soft:#2A2517; --chart:#8FB3E0; --chart-soft:#26384F;
  --ok:#4CC08A; --warn:#E0A03C; --bad:#E57A63; --ok-soft:#16301F; --bad-soft:#3A201A; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 150px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:22px;color:var(--navy)}
h3{font-size:18px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:12px}
.top h1{font-size:40px;line-height:1;color:var(--navy)}
.top .meta{display:flex;gap:20px;flex-wrap:wrap}
.top .meta b{display:block;font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 16px;font-family:var(--font-display);font-size:20px;font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--accent)}
button.chip{background:transparent;color:var(--navy);font-weight:600;border:1px dashed var(--navy);cursor:pointer}
.banner{position:sticky;top:0;z-index:15}
.banner{background:var(--accent-soft);border:1px solid var(--accent);padding:8px 12px;border-radius:6px;font-size:13px}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel > .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}

body{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}

<script>
/* Lean 185: standalone storage shim. Gives the dashboard the same db.doc(...).set / onSnapshot
   interface it had inside Claude, backed by /api/lift/docs. Works offline with a local queue. */
(function(){
  "use strict";
  if(window.claude&&window.claude.use)return;
  var API="/api/lift/docs",subs={},known={},started=false,busy=false,locked=false;
  function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
  var pend=function(){return ls("lift_pending")||{}},setPend=function(o){ls("lift_pending",o)};
  var snap=function(name,data){return{id:name,exists:!!data,data:function(){return data}}};
  function emit(name,data){(subs[name]||[]).forEach(function(f){try{f(snap(name,data))}catch(e){}})}
  function lock(){
    if(locked)return;locked=true;
    var w=document.createElement("div");w.className="lock";
    w.innerHTML='<form><h1>Lean 185</h1><div class="sub" style="color:var(--muted)">Enter your password to open your log.</div><input type="password" id="lkPw" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="submit" style="min-height:48px;font-size:17px">Unlock</button><div id="lkErr" style="color:var(--bad);font-weight:600;min-height:18px"></div></form>';
    document.body.appendChild(w);
    var f=w.querySelector("form"),pw=w.querySelector("#lkPw"),er=w.querySelector("#lkErr");
    setTimeout(function(){pw.focus()},50);
    f.addEventListener("submit",function(e){
      e.preventDefault();er.textContent="";
      fetch("/api/admin/auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw.value})})
        .then(function(r){if(!r.ok)throw 0;document.body.removeChild(w);locked=false;poll()})
        .catch(function(){er.textContent="That password did not work."});
    });
  }
  function req(method,url,body){
    return fetch(url,{method:method,cache:"no-store",headers:body?{"content-type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined}).then(function(r){
      if(r.status===401){lock();throw{code:"auth"}}
      if(!r.ok)throw{code:"http-"+r.status};
      return r.json();
    },function(){throw{code:"offline"}});
  }
  function flush(){
    var p=pend(),names=Object.keys(p),chain=Promise.resolve();
    names.forEach(function(n){chain=chain.then(function(){
      return req("PUT",API+"/"+n,{data:p[n]}).then(function(res){
        known[n]=res.updated_at;
        var q=pend();if(JSON.stringify(q[n])===JSON.stringify(p[n])){delete q[n];setPend(q)}
        ls("lift_cache_"+n,p[n]);
      });
    })});
    return chain;
  }
  function poll(){
    if(busy||locked)return;busy=true;
    flush().catch(function(){}).then(function(){return req("GET",API)}).then(function(res){
      var docs=res.docs||{},pp=pend();
      Object.keys(subs).forEach(function(n){
        if(pp[n])return;
        var rec=docs[n],ver=rec?rec.updated_at:"none";
        if(known[n]!==ver){known[n]=ver;if(rec)ls("lift_cache_"+n,rec.data);emit(n,rec?rec.data:null)}
      });
    }).catch(function(){}).then(function(){busy=false});
  }
  function start(){

function plan(s){

function warnings(s){
  const p=plan(s),out=[];

  const g=SESS[p.key].grp,y=plan(addDays(s,-1));
  if(addDays(s,-1)>=PLAN_START&&y.key&&SESS[y.key].grp===g&&dayState(addDays(s,-1))!=="missed")out.push("Yesterday was also a "+g+" day. Same muscles back to back, so expect weaker lifts or move this one.");

  return out;
}

}

function lastSession(name,before){
  const by={};allLifts().filter(l=>l.ex===name&&l.d<before).forEach(l=>{(by[l.d]=by[l.d]||[]).push(l)});
  const ds_=Object.keys(by).sort();if(!ds_.length)return null;
  const d=ds_[ds_.length-1];return{d,sets:by[d]};
}
function suggest(name,target,before){
  const ls=lastSession(name,before);if(!ls)return null;
  const top=Math.max.apply(null,ls.sets.map(x=>x.lb)),at=ls.sets.filter(x=>x.lb===top);

  const prep=h("div",{class:"panel"},h("div",{class:"head"},h("h2",null,"Sunday prep"),confirmBtn("Clear checks",()=>{Object.keys(state.shop).forEach(k=>{if(k.indexOf("p_")===0)delete state.shop[k]});persist("shop");schedule()})));
  const pc=h("div",{class:"checks"});
  PREP.forEach((x,i)=>{const key="p_"+i;pc.appendChild(h("label",null,h("input",{type:"checkbox",checked:!!state.shop[key],onchange:e=>{if(e.target.checked)state.shop[key]=1;else delete state.shop[key];persist("shop");schedule()}}),h("span",{text:x[0]}),h("span",{class:"cost",text:x[1]})))});
  prep.appendChild(pc);root.appendChild(prep);
  return root;
}
function addFood(n,k,p){const a=foodOn(sel).slice();a.push({n,k,p});state.food[sel]=a;persist("food");schedule()}

/* ----- Plan ----- */
function viewPlan(){
  const root=h("div",{class:"col"});
  const bp=h("div",{class:"panel"},h("div",{class:"head"},h("h2",null,"Blocks")));
  bp.appendChild(h("div",{class:"scroll"},h("table",null,h("thead",null,h("tr",null,h("th",null,"Block"),h("th",null,"Dates"),h("th",{class:"n"},"Calories"),h("th",{class:"n"},"Protein"),h("th",null,"Focus"))),
    h("tbody",null,...BLOCKS.map(b=>h("tr",{class:b.from<=TODAY&&TODAY<=b.to?"today":""},h("td",{text:b.name}),h("td",{text:short(b.from)+" to "+short(b.to)}),h("td",{class:"n",text:b.kcal}),h("td",{class:"n",text:b.prot}),h("td",{text:b.note})))))));
  root.appendChild(bp);
  const cp=h("div",{class:"panel"},h("div",{class:"head"},h("h2",null,"Day by day"),h("button",{class:"ghost",onclick:()=>{calAll=!calAll;schedule()}},calAll?"Show next 14 days":"Show all "+(diffDays(PLAN_START,END)+1)+" days")));
  const from=calAll?PLAN_START:clampDay(TODAY);let n=0;const body=h("tbody");
  for(let x=from;x<=END;x=addDays(x,1)){
    if(!calAll&&n>=14)break;n++;
    const p=plan(x),st=isDone(x)?doneText(x):dayState(x)==="missed"?"Missed":"";
    body.appendChild(h("tr",{class:"click"+(x===TODAY?" today":x<TODAY?" past":""),tabindex:"0",onclick:()=>{sel=x;tab="today";schedule()},onkeydown:e=>{if(e.key==="Enter"){sel=x;tab="today";schedule()}}},
      h("td",{text:lab(x)}),h("td",{text:p.title}),h("td",{text:p.note||(p.run?p.run[2]:p.sub)}),h("td",{class:"n",text:p.block.kcal}),h("td",null,st?h("span",{class:"pill "+(st==="Missed"?"missed":"done")},st):"")));
  }
  cp.appendChild(h("div",{class:"hint",style:"margin-bottom:6px",text:"Tap any day to open it in Today."}));
  cp.appendChild(h("div",{class:"scroll"},h("table",null,h("thead",null,h("tr",null,h("th",null,"Date"),h("th",null,"Session"),h("th",null,"Detail"),h("th",{class:"n"},"Calories"),h("th",null,"Status"))),body)));
  root.appendChild(cp);
  const g=h("div",{class:"grid2e"});
  const ck=h("div",{class:"panel"},h("div",{class:"head"},h("h2",null,"Check ins")));
  ck.appendChild(h("div",{class:"scroll"},h("table",null,h("thead",null,h("tr",null,h("th",null,"Date"),h("th",null,"Measure"),h("th",null,"Decision"))),h("tbody",null,...CHECKS.map(c=>h("tr",{class:c[0]===TODAY?"today":""},h("td",{text:lab(c[0])}),h("td",{text:c[1]}),h("td",{text:c[2]})))))));
  g.appendChild(ck);
  const ts=h("div",{class:"panel"},h("div",{class:"head"},h("h2",null,"Jul 21 test day"),confirmBtn("Clear checks",()=>{Object.keys(state.shop).forEach(k=>{if(k.indexOf("t_")===0)delete state.shop[k]});persist("shop");schedule()})));
  const tc=h("div",{class:"checks"});
  TESTS.forEach((x,i)=>{const key="t_"+i;tc.appendChild(h("label",null,h("input",{type:"checkbox",checked:!!state.shop[key],onchange:e=>{if(e.target.checked)state.shop[key]=1;else delete state.shop[key];persist("shop");schedule()}}),h("span",{text:x})))});
  ts.appendChild(tc);g.appendChild(ts);root.appendChild(g);
  root.appendChild(h("div",{class:"foot",text:"Weigh in every morning and judge the weekly average. Leg Day A is Tuesday, Leg Day B is Saturday. Logs save in this dashboard."}));
  return root;
}

/* ---------------- render loop ---------------- */
function renderAll(){
  renderHeader();
  const v=$("view");
  // keep focus on typed inputs where possible
  const ae=document.activeElement,id=ae&&ae.id,selStart=ae&&ae.selectionStart;
  clear(v);
  v.appendChild(tab==="summary"?viewSummary():tab==="progress"?viewProgress():tab==="food"?viewFood():tab==="plan"?viewPlan():viewToday());
  if(id){const n=document.getElementById(id);if(n&&n!==ae){n.focus();try{n.setSelectionRange(selStart,selStart)}catch(e){}}}
}
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderAll()})}
function fromHash(){const t=(location.hash||"").replace("#","");if(TABS.some(x=>x[0]===t)){tab=t;schedule()}}
window.addEventListener("hashchange",fromHash);
$("tmAdd").addEventListener("click",()=>{timerEnd+=30000;if($("timer").className!=="timer"){$("timer").className="timer";clearInterval(timerH);timerH=setInterval(timerTick,250)}timerTick()});
$("tmSkip").addEventListener("click",()=>{clearInterval(timerH);timerEnd=0;$("timer").hidden=true});
setInterval(()=>{const n=etDate();if(n!==TODAY){const was=sel===clampDay(TODAY);TODAY=n;if(was)sel=clampDay(TODAY);schedule()}const c=$("hdrClock");if(c)c.textContent=etClock()},10000);
fromHash();renderAll();initStore();
})();
</script>
